{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Intranet ACJOGOS{% endblock %}</title>
    <style>
        /* CSS Básico só para não ficar tudo branco */
        body { font-family: sans-serif; padding: 20px; }
        nav { background: #eee; padding: 10px; margin-bottom: 20px; }
        a { text-decoration: none; color: #007bff; }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a> |
        
        {% if user.is_authenticated %}
          <span>Olá, <strong>{{ user.nome|default:user.email }}</strong>!</span> |
          
          <form action="{% url 'logout' %}" method="POST" style="display: inline;">
            {% csrf_token %}
            <button type="submit" style="background:none; border:none; padding:0; color:red; text-decoration:underline; cursor:pointer;">
            Sair (Logout)
            </button>
          </form>

        {% else %}
          <a href="{% url 'login' %}">Entrar (Login)</a> | 
          <a href="#">Cadastre-se</a>
        {% endif %}
      </nav>
    </header>

    <main>
      {% block content %} 
      {% endblock %}
    </main>

    <footer>
      <hr>
      <p>© 2025 - Intranet ACJOGOS-RJ</p>
    </footer>
  </body>
</html>
